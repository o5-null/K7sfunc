# k7f_playkit.lua 的配置（本 fork 新增）
#
# 只影响"由 lua 前端临时生成的 vpy"；自己写 vpy 直接调 k7f.PLAYKIT_* 时，
# 这些参数不生效。
#
# 用法：在 input.conf 里绑定，例如
#   Ctrl+Shift+p  script-binding k7f_playkit/toggle
#   Ctrl+Shift+o  script-binding k7f_playkit/off

# 生成的 vpy 存放目录（~~/ 表示 mpv 配置目录）
cache_dir = ~~/

# 预设：auto / upscale / memc / denoise / deband / clean / anime / live
# auto 只在片源高度低于 target_h 时超分
preset = auto

# 目标高度；0 = 跟随当前屏幕高度（display-height）
target_h = 0

# 超分引擎：auto / artcnn / acnet / cugan / edi / ngu / none
# auto 按 artcnn → acnet → cugan → edi → ngu → none 顺序降级
engine = auto

# 插帧引擎：auto / rife_nv / rife_dml / none
memc_engine = auto

# 插帧目标帧率（仅在预设需要插帧时生效）
memc_fps = 60

# NLM 降噪强度
denoise_lv = 3.0

# 去色带阈值，越高越激进
deband_rth = 48.0

# 显卡序号与 TensorRT/CUDA 相关参数
gpu = 0
gpu_m = 1
gpu_t = 2
